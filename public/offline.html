<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#234F6B" />
    <title>Sem conexão — Arretado de Barato</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf7f2;
        color: #253744;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: #234f6b;
        color: white;
        font-weight: bold;
      }
      a:focus-visible {
        outline: 3px solid #a24d34;
        outline-offset: 4px;
      }
      .brand {
        color: #234f6b;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Arretado de Barato</p>
      <h1>Você está sem conexão</h1>
      <p>
        Conecte-se à internet para abrir o aplicativo e consultar preços de produtos e combustíveis.
      </p>
      <p>
        Esta tela não mostra preços salvos. As listas e os favoritos já guardados neste aparelho não
        foram apagados.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
